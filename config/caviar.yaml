detector:
  model_path: yolo11n.pt
  confidence: 0.25
  iou: 0.70
  image_size: 640
  device:
  classes: [0]

tracker:
  backend: bytetrack
  ultralytics_tracker: bytetrack.yaml
  min_box_area: 64

analytics:
  lines: []
  zones: []
  keep_trajectory_points: 10000
  expected_direction:
  loitering_enabled: true
  loitering_min_duration_sec: 10.0
  loitering_max_radius_px: 50.0
  loitering_min_path_length_px: 100.0
  route_mining_enabled: true

output:
  save_annotated_video: false
  save_evidence_cards: false

runtime:
  frame_skip: 1
  privacy_blur: false
  draw_trajectories: false
  show_fps: false
