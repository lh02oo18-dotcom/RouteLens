detector:
  model_path: yolo11n.pt
  confidence: 0.5
  iou: 0.7
  image_size: 640
  device:
  classes: [0]

tracker:
  backend: bytetrack
  iou_threshold: 0.3
  max_misses: 5
  ultralytics_tracker: bytetrack.yaml
  min_box_area: 64

analytics:
  lines:
    - name: main
      start: [100, 300]
      end: [900, 300]
      in_direction: negative_to_positive
      debounce_frames: 12
  zones: []
  keep_trajectory_points: 300
  overcrowding_threshold:
  expected_direction:
  anomaly_min_points: 5
  reverse_cosine_threshold: -0.5
  reverse_min_duration_sec: 1.0
  reverse_min_distance_px: 40.0
  loitering_enabled: true
  loitering_min_duration_sec: 10.0
  loitering_max_radius_px: 50.0
  loitering_min_path_length_px: 100.0
  route_mining_enabled: true
  route_min_points: 5
  route_resample_points: 16
  route_dbscan_eps: 0.08
  route_dbscan_min_samples: 3
  route_deviation_threshold: 0.12

output:
  directory: outputs
  save_frame_metrics_csv: true
  save_events_csv: true
  save_trajectories_csv: true
  save_trajectory_features_csv: true
  save_anomaly_events_csv: true
  save_anomaly_events_json: true
  save_route_assignments_csv: true
  save_route_prototypes_csv: true
  save_route_summary_json: true
  save_summary_json: true
  save_annotated_video: false
  annotated_video_name: annotated_output.mp4

runtime:
  frame_skip: 1
  max_frames:
  display_width: 960
  privacy_blur: false
  draw_trajectories: true
  show_fps: true
